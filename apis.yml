name: Braid Social
description: >-
  Braid Social, Inc. is a venture-backed startup that has run two products under
  the Braid name. It launched as a creator-economy, direct-to-fan engagement
  platform — founded by former Facebook product designer Matthew Cahill and
  software engineer Chris Piro — letting creators build customizable landing
  pages that consolidated their work across the web (blog posts, videos,
  podcasts, and commerce links), collect fan phone numbers, and reach followers
  directly through SMS, push notifications, and mailing lists, with link
  tracking and cross-platform analytics. It raised a $6.8M seed round in August
  2023 led by Andreessen Horowitz (a16z) with Initialized Capital. The original
  domain braid.ai is now a domain-for-sale listing at atom.com and braid.social
  no longer resolves. The same legal entity now ships "Braid Teams" at
  trybraid.io (mirrored at braidsocial.com) — an AI-powered employee-engagement
  copilot that runs inside Slack, automating icebreakers, games, polls, events,
  reminders, leaderboards, and engagement reporting for distributed teams, on a
  free / $5-per-user Premium / contact-us Enterprise plan. Braid Teams is a
  Slack-app product with no public developer program: no developer portal, no
  documentation, no OpenAPI, no SDKs, and no GitHub organization. The only
  machine surface is the private application backend at core.trybraid.io, which
  answers {"status":"ok"} at its root and 404s every spec, docs and
  /.well-known/ path. The homepage states the product is "Currently not
  accepting new users" and the Slack install endpoint returns HTTP 500.
