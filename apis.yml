name: Braid Social
description: >-
  Braid (Braid Social) was a creator-economy startup building a direct-to-fan
  engagement platform for the creator economy. Founded by former Facebook
  product designer Matthew Cahill and software engineer Chris Piro, Braid let
  creators build customizable landing pages that consolidated their work across
  the web (blog posts, videos, podcasts, and commerce links), collect fan phone
  numbers, and reach followers directly through SMS text messages, push
  notifications, and mailing lists, with link tracking and cross-platform
  analytics. Positioned as a creator-friendly, direct-to-audience alternative to
  algorithm-driven social platforms, Braid raised a $6.8M seed round in August
  2023 led by Andreessen Horowitz (a16z) with Initialized Capital. The company
  appears to be defunct as of this profile — its primary domain (braid.ai) now
  redirects to a domain-for-sale listing and no developer, documentation, or API
  surface could be found. Added to the API Evangelist network as an a16z
  portfolio lead; no public API artifacts exist to enrich.
